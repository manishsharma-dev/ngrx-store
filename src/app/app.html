<h1>Ngrx Effect</h1>

<button (click)="load()">Load Users</button>

@if(users$ | async; as users){
    @if(users.loading){
        <p>Loading...</p>
    }
    @else if(users.error){
        <p>Error: {{users.error}}</p>
    }
    @else {
        <ul>
            @for(user of users.users; track user.id){
                <li>{{user.name}}</li>
            }
        </ul>
    }
}
